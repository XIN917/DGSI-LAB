[project]
name = "dgsi-retailer"
version = "0.1.0"
description = "DGSI Retailer App - Week 7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "typer>=0.12.5",
    "click<8.1.8",
    "httpx>=0.28.1",
    "python-multipart>=0.0.28",
    "aiosqlite>=0.22.1",
    "greenlet>=3.1.1",
]

[project.scripts]
retailer-cli = "app.cli:app"

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
